# Hạ tầng truy cập (Người 1): Service Registry + API Gateway
# Kho và định giá (Người 2): Inventory Service + Pricing Service (nhân bản stateless + shared volume)
#
#   docker compose up --build -d
#   docker compose up -d --scale inventory-service=3     # thêm bản sao Inventory
#
# Khi người 3 có service thật: thêm order-service, payment-service với env REGISTRY_URL=http://registry:4000.

services:
  registry:
    build:
      context: .
      dockerfile: services/registry/Dockerfile
    environment:
      PORT: 4000
    ports:
      - "4000:4000"

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      PORT: 8080
      REGISTRY_URL: http://registry:4000
      REGISTRY_CACHE_TTL_MS: 2000
      UPSTREAM_TIMEOUT_MS: 5000
      QUARANTINE_MS: 5000
    ports:
      - "8080:8080"
    depends_on:
      - registry

  # Backend Người 2: không publish port ra host, không đặt container_name -> scale được.
  # Các bản sao stateless dùng chung volume `shared-data` kết hợp khóa nguyên tử FileStore.
  inventory-service:
    build:
      context: .
      dockerfile: services/inventory/Dockerfile
    environment:
      SERVICE_NAME: inventory-service
      PORT: 3000
      REGISTRY_URL: http://registry:4000
      REGISTRY_TTL_SECONDS: 10
      RESERVATION_TTL_SECONDS: 30
      INVENTORY_DATA_FILE: /data/inventory.json
    volumes:
      - shared-data:/data
    deploy:
      replicas: 2
    depends_on:
      - registry

  pricing-service:
    build:
      context: .
      dockerfile: services/pricing/Dockerfile
    environment:
      SERVICE_NAME: pricing-service
      PORT: 3000
      REGISTRY_URL: http://registry:4000
      REGISTRY_TTL_SECONDS: 10
      PRICING_DATA_FILE: /data/pricing.json
    volumes:
      - shared-data:/data
    deploy:
      replicas: 2
    depends_on:
      - registry

volumes:
  shared-data:
